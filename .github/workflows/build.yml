name: Build document

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          texlive_version: 2026
          latexmk_use_lualatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: modular-latex-template
          path: build/main.pdf
          if-no-files-found: error
